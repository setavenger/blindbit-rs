[package]
name = "friglet"
version = "0.1.0"
edition = "2024"
authors.workspace = true

[dependencies]
blindbit-lib = { path = "../blindbit-lib", features = ["serde"] }
friglet-ipc = { path = "../friglet-ipc" }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4.3"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0"
# The Electrum server's own P2P peer (src/electrum/p2p.rs) uses bitcoin's
# `p2p` message types: it needs relay = true in its handshake, which the
# `bitcoin-p2p` crate blindbit-lib downloads blocks with never sends.
bitcoin = "0.32.8"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Oracle tip polling in GetStatus (and lazy no-network channels in tests);
# version pinned to blindbit-lib's tonic.
tonic = "0.14.2"
# Same bdk-sp fork rev as blindbit-lib's bdk_sp/indexer (SNB-540, see the comment there);
# change them together.
bdk_sp = { git = "https://github.com/setavenger/bdk-sp", rev = "94b72f60b0015793e4db67355bdab8d240eecc00", version = "0.1.0" }

[dev-dependencies]
figment = { version = "0.10", features = ["toml", "env", "test"] }
