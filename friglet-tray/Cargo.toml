[package]
name = "friglet-tray"
version = "0.1.0"
edition = "2024"
authors.workspace = true
description = "System tray companion app for the friglet daemon (Tauri v2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
friglet-ipc = { path = "../friglet-ipc" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "sync", "time"] }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# Linux: route tray-icon to its KSNI (StatusNotifierItem over D-Bus) backend.
# Tauri enables the libappindicator backend, which never reports clicks
# (libayatana rejects `Activate`), so a left click on the icon did nothing.
# With both features on, tray-icon uses KSNI: `ItemIsMenu=false`, left click
# arrives as `TrayIconEvent::Click`, right click still opens the menu.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
