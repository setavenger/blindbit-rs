[package]
name = "blindbit-lib"
version = "0.1.0"
edition = "2024"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
# `net::testing`: a fake SOCKS5 proxy for tests of code that dials through
# `net::Dialer` (friglet's tests use it).
test-util = []

[build-dependencies]
tonic-prost-build = "0.14.2"

[dependencies]
# Pinned to setavenger/bdk-sp commit 94b72f6, "fix(receive): stop scan_txouts at BIP-352
# K_max" (setavenger/bdk-sp#1, SNB-540). That PR lands in the fork with a merge commit, never
# squash or rebase, so this exact commit stays in the fork's history and the pin stays valid
# after the merge. friglet/Cargo.toml pins bdk_sp to the same rev; change both together.
bdk_sp = { features = ["serde"], git = "https://github.com/setavenger/bdk-sp", rev = "94b72f60b0015793e4db67355bdab8d240eecc00", version = "0.1.0" }
indexer = { features = ["serde"], git = "https://github.com/setavenger/bdk-sp", rev = "94b72f60b0015793e4db67355bdab8d240eecc00", version = "0.1.0" }

prost = "0.14.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# net, sync, macros, rt: the P2P block fetch connects on a blocking thread
# (`spawn_blocking`) and waits for its download thread over a oneshot channel,
# both under `select!` against a cancellation token (tokio-util), so a stop
# never waits on them; peer discovery resolves DNS seeds in spawned tasks.
tokio = { version = "1.48.0", features = ["time", "net", "sync", "macros", "rt"] }
tokio-util = "0.7"
tonic = { version = "0.14.2", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.2"
hex = "0.4.3"
tracing = { workspace = true }
bitcoin = "0.32.8"
# Block download over Bitcoin P2P: the `bitcoin-p2p` crate of kernel-node
# (successor of the archived 2140-dev/bitcoin-p2p), on the same bitcoin 0.32
# as the rest of the workspace, so its messages, blocks and `Network` are
# this crate's types. Pinned to a commit: the crate has no releases.
bitcoin-p2p = { git = "https://github.com/kernel-node/kernel-node", rev = "d421e330d2c3f13050cd4e5abddfa1cce134aa19", version = "0.1.0" }
# The new/tried address tables of discovered peers (kernel-node's address
# book, as Kyoto uses it), from crates.io.
bitcoin-address-book = "0.2.2"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The BIP-352 vector tests are synchronous, but tonic's `connect_lazy` needs a
# Tokio runtime in scope to build the (never-connected) oracle channel. Declared
# explicitly so the tests do not depend on tonic's transitive feature selection.
tokio = { version = "1.48.0", features = ["rt", "time", "net"] }
# Log output for the `fetch_block` example.
tracing-subscriber = { workspace = true }
