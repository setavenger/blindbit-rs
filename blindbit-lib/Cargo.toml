[package]
name = "blindbit-lib"
version = "0.1.0"
edition = "2024"

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "dep:base64"]

[build-dependencies]
tonic-prost-build = "0.14.2"

[[example]]
name = "stream_oracle"

[[example]]
name = "fetch_block"

[dependencies]
# bitcoin = "0.32.7"
# bitcoin = { version = "0.32.7", features = ["secp256k1"] }
# bdk_sp = { git = "https://github.com/bitcoindevkit/bdk-sp", version = "0.1.0", features = ["serde"] }
# indexer = { git = "https://github.com/bitcoindevkit/bdk-sp", version = "0.1.0", features = ["serde"] }
# Pinned to setavenger/bdk-sp commit 94b72f6, "fix(receive): stop scan_txouts at BIP-352
# K_max" (setavenger/bdk-sp#1, SNB-540). That PR lands in the fork with a merge commit, never
# squash or rebase, so this exact commit stays in the fork's history and the pin stays valid
# after the merge. friglet/Cargo.toml pins bdk_sp to the same rev; change both together.
bdk_sp = { features = ["serde"], git = "https://github.com/setavenger/bdk-sp", rev = "94b72f60b0015793e4db67355bdab8d240eecc00", version = "0.1.0" }
indexer = { features = ["serde"], git = "https://github.com/setavenger/bdk-sp", rev = "94b72f60b0015793e4db67355bdab8d240eecc00", version = "0.1.0" }


prost = "0.14.1"
prost-types = "0.14.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.48.0", features = ["time"] }
tonic = { version = "0.14.2", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.2"
hex = "0.4.3"
base64 = { version = "0.22", optional = true }
tracing = { workspace = true }
bitcoin = "0.32.7"
# due to bitcoin-p2p using a different version
bitcoin-rev = { git = "https://github.com/rust-bitcoin/rust-bitcoin", rev = "16cc257c3695dea0e7301a5fa9cab44b8ed60598", package = "bitcoin" }


silentpayments = { git = "https://github.com/cygnet3/rust-silentpayments", version = "0.4.1" }

# bitcoin-p2p is on a specific revision of rust-bitcoin which creates some issues
bitcoin-p2p = { git = "https://github.com/2140-dev/bitcoin-p2p", version = "0.1.0" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The BIP-352 vector tests are synchronous, but tonic's `connect_lazy` needs a
# Tokio runtime in scope to build the (never-connected) oracle channel. Declared
# explicitly so the tests do not depend on tonic's transitive feature selection.
tokio = { version = "1.48.0", features = ["rt", "time", "net"] }
# Log output for the `fetch_block` example.
tracing-subscriber = { workspace = true }
