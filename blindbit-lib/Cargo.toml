[package]
name = "blindbit-lib"
version = "0.1.0"
edition = "2024"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]

[build-dependencies]
tonic-prost-build = "0.14.2"

[dependencies]
bdk_sp = { features = ["serde"], git = "https://github.com/setavenger/bdk-sp", version = "0.1.0" }
indexer = { features = ["serde"], git = "https://github.com/setavenger/bdk-sp", version = "0.1.0" }

prost = "0.14.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# net, sync, macros: the P2P block fetch connects asynchronously and waits
# for its download thread over a oneshot channel, both under `select!`
# against a cancellation token (tokio-util), so a stop never waits on it.
tokio = { version = "1.48.0", features = ["time", "net", "sync", "macros"] }
tokio-util = "0.7"
tonic = { version = "0.14.2", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.2"
hex = "0.4.3"
tracing = { workspace = true }
bitcoin = "0.32.7"
# due to bitcoin-p2p using a different version
bitcoin-rev = { git = "https://github.com/rust-bitcoin/rust-bitcoin", rev = "16cc257c3695dea0e7301a5fa9cab44b8ed60598", package = "bitcoin" }

# bitcoin-p2p is on a specific revision of rust-bitcoin which creates some issues
bitcoin-p2p = { git = "https://github.com/2140-dev/bitcoin-p2p", version = "0.1.0" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The BIP-352 vector tests are synchronous, but tonic's `connect_lazy` needs a
# Tokio runtime in scope to build the (never-connected) oracle channel. Declared
# explicitly so the tests do not depend on tonic's transitive feature selection.
tokio = { version = "1.48.0", features = ["rt", "time", "net"] }
# Log output for the `fetch_block` example.
tracing-subscriber = { workspace = true }
