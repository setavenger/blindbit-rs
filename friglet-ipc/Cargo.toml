[package]
name = "friglet-ipc"
version = "0.1.0"
edition = "2024"
authors.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["io-util"] }
interprocess = { version = "2.3", features = ["tokio"] }
dirs = "6.0"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
