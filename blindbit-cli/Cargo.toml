[package]
name = "blindbit-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
blindbit-lib = { path = "../blindbit-lib", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
bitcoin = "0.32.8"

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
